name: TikTok AI

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          - name: Run AI script
          env:
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  run: python main.py
